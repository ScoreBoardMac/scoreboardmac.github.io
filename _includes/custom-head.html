{%- comment -%} hreflang-ссылки на все переводы текущей страницы (связь по page.ref) {%- endcomment -%}
{%- if page.ref -%}
  {%- assign translations = site.pages | where: "ref", page.ref -%}
  {%- for t in translations %}
<link rel="alternate" hreflang="{{ t.lang | default: site.lang }}" href="{{ t.url | absolute_url }}">
    {%- if t.lang == site.lang %}
<link rel="alternate" hreflang="x-default" href="{{ t.url | absolute_url }}">
    {%- endif -%}
  {%- endfor -%}
{%- endif %}
<style>
  .lang-switch a, .lang-switch strong { margin-left: 4px; }
  .lang-switch strong { font-weight: 600; }
  details.legacy-method { border: 1px solid #8884; border-radius: 10px; padding: 0 16px; margin-bottom: 15px; }
  details.legacy-method > summary { cursor: pointer; font-weight: 600; padding: 12px 0; }
  details.legacy-method[open] > summary { margin-bottom: 8px; border-bottom: 1px solid #8884; }
</style>
